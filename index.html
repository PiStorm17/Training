<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1514">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Personal training schedule and log. Everything stays on this device.">
<title>Edinburgh 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
try { var t = localStorage.getItem("e27-theme"); if (t === "light" || t === "auto" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
/* Layout: one column, sticky header, fixed tab bar for the thumb. Colours are the plan's HR zones. */
:root{
  --paper:#F1F5F3; --card:#FCFDFC; --sunk:#E5ECE9; --ink:#13201E; --ink-2:#4E605D; --ink-3:#7D8E8B; --rule:#D3DDDA;
  --z1:#2C7DA0; --z2:#23865A; --z3:#B5731B; --str:#6A51B5; --rest:#8C9A97; --race:#C03E2D;
  --good:#1D6F47; --good-bg:#DCF1E5; --warn:#7E4C00; --warn-bg:#FCEFD3; --bad:#A93526; --bad-bg:#FADFDA;
  --accent:#1D7550; --on-accent:#FFFFFF;
  --f-display:"Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-data:ui-monospace,"Roboto Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --tab-h:64px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0D1514; --card:#151F1D; --sunk:#0A100F; --ink:#E4EDEA; --ink-2:#A1B3AF; --ink-3:#6C7F7B; --rule:#263533;
  --z1:#5BAED2; --z2:#4CC489; --z3:#E8A94B; --str:#A88EF2; --rest:#6C7C79; --race:#F06A55;
  --good:#5ED39A; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#33270F; --bad:#FF8F7E; --bad-bg:#3A1A15;
  --accent:#4CC489; --on-accent:#0D1514; color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --paper:#0D1514; --card:#151F1D; --sunk:#0A100F; --ink:#E4EDEA; --ink-2:#A1B3AF; --ink-3:#6C7F7B; --rule:#263533;
    --z1:#5BAED2; --z2:#4CC489; --z3:#E8A94B; --str:#A88EF2; --rest:#6C7C79; --race:#F06A55;
    --good:#5ED39A; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#33270F; --bad:#FF8F7E; --bad-bg:#3A1A15;
    --accent:#4CC489; --on-accent:#0D1514; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tone-z1{--tone:var(--z1)}.tone-z2{--tone:var(--z2)}.tone-z3{--tone:var(--z3)}
.tone-str{--tone:var(--str)}.tone-rest{--tone:var(--rest)}.tone-race{--tone:var(--race)}
.data{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{padding-block:8px}
.navrow{display:flex;align-items:center;gap:10px;min-height:52px}
.navrow .tt{flex:1;min-width:0;text-align:center}
.navrow .tt b{display:block;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;line-height:1.15}
.navrow .tt span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{flex:0 0 48px;height:48px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font-size:22px;line-height:1;cursor:pointer}
.navbtn:disabled{opacity:.3}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);min-height:28px}
.pill{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;min-height:32px}
#saveMark{color:var(--ink-3);text-transform:none;letter-spacing:0;transition:opacity .4s}
#saveMark.err{color:var(--bad)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{height:var(--tab-h);border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

main{display:grid;gap:16px;padding-block:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.pad{padding:16px}
h2.ct{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px}
.hint{color:var(--ink-2);font-size:15px;margin:8px 0 0}
.muted{color:var(--ink-2)}

/* plan card */
.plan .top{padding:16px 16px 18px;border-top:5px solid var(--tone)}
.dateline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.chip{font-size:11px;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;text-transform:uppercase}
.chip.now{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.gate{color:var(--race)}
.plan h1{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;margin:8px 0 0;text-wrap:balance}
.mins{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.mins b{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.95;color:var(--tone);font-variant-numeric:tabular-nums}
.mins span{font-size:14px;color:var(--ink-2);letter-spacing:.08em;text-transform:uppercase}
.lead{font-size:17px;font-weight:600;margin-top:8px}
.cap{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:15px}
.cap.warn{background:var(--warn-bg);color:var(--warn)}
.hr{margin-top:14px}
.hr-head{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.hr-head .data{letter-spacing:0;text-transform:none;font-size:14px;color:var(--ink)}
.track{position:relative;height:28px;margin-top:20px;border-radius:6px;background:var(--sunk);border:1px solid var(--rule)}
.seg{position:absolute;top:0;bottom:0;opacity:.2;background:var(--tone)}
.fill{position:absolute;top:5px;bottom:5px;border-radius:4px;background:var(--tone)}
.lthr{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--race)}
.lthr::after{content:"LTHR 188";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);font-family:var(--f-data);font-size:10px;color:var(--race);white-space:nowrap}
.ticks{position:relative;height:16px;margin-top:4px;font-family:var(--f-data);font-size:10px;color:var(--ink-3)}
.ticks span{position:absolute;transform:translateX(-50%)}
.hrnote{font-size:14px;color:var(--ink-2);margin-top:4px}
.hip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:14px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.hip div{background:var(--card);padding:8px 10px;font-size:13px;line-height:1.3}
.hip div b{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.exlist{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--rule)}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.exlist li span:first-child{font-weight:600}
.exlist li span:last-child{font-family:var(--f-data);font-size:14px;color:var(--ink-2);white-space:nowrap}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-size:15px}
.note b{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.note.heat{border-color:var(--race)} .note.heat b{color:var(--race)}
.note.later b{color:var(--str)}
details.more{border-top:1px solid var(--rule)}
details.more>summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:48px;display:flex;justify-content:space-between;align-items:center;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";font-family:var(--f-data);font-size:18px;color:var(--ink-3)}
details.more[open]>summary::after{content:"\2212"}
details.more p{margin:0;padding:0 16px 16px;font-size:16px;line-height:1.6}

/* forms */
details.form>summary{list-style:none;cursor:pointer;padding:16px;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:2px}
details.form>summary::-webkit-details-marker{display:none}
.sum-t{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.sum-s{font-size:14px;color:var(--ink-2)}
.fbody{padding:0 16px 16px;display:grid;gap:14px}
section.form{padding:16px;display:grid;gap:14px}
section.form h2.ct{margin:0}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.field .ends{font-weight:400;color:var(--ink-3);letter-spacing:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input.inp,select.inp,textarea.inp{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);padding:12px;font-size:18px}
textarea.inp{min-height:88px;resize:vertical;font-size:16px;line-height:1.4}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg2{display:grid;gap:6px}
.seg2 button,.status button{min-height:48px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-size:17px;font-weight:600;cursor:pointer;padding:0 4px}
.seg2 button[aria-pressed="true"],.status button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.status button{min-height:56px;font-size:16px}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.stepper button{height:50px;border:0;background:transparent;font-size:24px;cursor:pointer}
.stepper button:active{background:var(--sunk)}
.stepper .v{text-align:center;font-family:var(--f-data);font-size:20px;font-variant-numeric:tabular-nums;cursor:pointer;height:50px;line-height:50px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.stepper .v.empty{color:var(--ink-3)}
.physio{display:grid;gap:10px;border-top:1px solid var(--rule);padding-top:14px}
.physio .ph-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.physio .ph-h b{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--str)}
.physio .ph-h span{font-size:13px;color:var(--ink-2)}
.excard{border:1px solid var(--rule);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--paper)}
.excard .exh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.excard .exh b{font-size:16px}
.excard .exh span{font-family:var(--f-data);font-size:13px;color:var(--ink-2);white-space:nowrap}
.fb{display:grid;gap:8px}
.flag{padding:10px 12px;border-radius:10px;font-size:15px;background:var(--sunk)}
.flag.good{background:var(--good-bg);color:var(--good)}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.flag.bad{background:var(--bad-bg);color:var(--bad)}

/* week */
.decision{padding:16px;display:grid;gap:6px}
.decision .big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.02em}
.decision.hold .big{color:var(--warn)} .decision.go .big{color:var(--good)} .decision.none .big{color:var(--ink-3)}
.decision ul{margin:4px 0 0;padding-left:20px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px;min-width:0}
.tile .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--ink-2)}
.tile.warn .v{color:var(--warn)} .tile.bad .v{color:var(--bad)}
.dlist{display:grid}
.drow{display:grid;grid-template-columns:44px 4px 1fr auto;gap:12px;align-items:center;padding:10px 12px;min-height:64px;border:0;border-bottom:1px solid var(--rule);
  background:transparent;text-align:left;cursor:pointer;width:100%}
.drow:last-child{border-bottom:0}
.drow .d{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);line-height:1.2}
.drow .d i{display:block;font-style:normal;font-family:var(--f-data);font-size:15px;color:var(--ink);letter-spacing:0}
.drow .st{align-self:stretch;border-radius:2px;background:var(--tone)}
.drow .t{min-width:0}
.drow .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .t>span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .r{text-align:right;font-family:var(--f-data);font-size:13px;color:var(--ink-2);white-space:nowrap}
.drow .r b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink)}
.drow.today .d{color:var(--accent);font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:6px;text-transform:uppercase}
.badge.ok{background:var(--good-bg);color:var(--good)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.mid{background:var(--warn-bg);color:var(--warn)}

/* buttons */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font-weight:700;font-size:16px;cursor:pointer;padding:0 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.full{grid-column:1 / -1}
.btn:disabled{opacity:.4}

/* report */
.toggles{display:grid;gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 4px;font-size:16px}
.toggle input{width:26px;height:26px;accent-color:var(--accent)}
pre.rep{margin:0;padding:14px;background:var(--sunk);border-radius:12px;font-family:var(--f-data);font-size:12.5px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;max-height:55vh;overflow:auto;border:1px solid var(--rule)}

/* guide */
.guide details{border-bottom:1px solid var(--rule)}
.guide details:last-child{border-bottom:0}
.guide summary{list-style:none;cursor:pointer;padding:16px;min-height:56px;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-family:var(--f-data);font-size:18px;color:var(--ink-3)}
.guide details[open] summary::after{content:"\2212"}
.guide .gb{padding:0 16px 16px;display:grid;gap:10px;font-size:16px}
.guide .gb p{margin:0}
.guide dl{margin:0;display:grid;gap:10px}
.guide dt{font-weight:700}
.guide dd{margin:2px 0 0;color:var(--ink-2)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.src{font-size:13px;color:var(--ink-3)}

/* banners, toast */
.banner{padding:14px 16px;border-radius:14px;display:grid;gap:10px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.banner.info{background:var(--card);color:var(--ink);border-color:var(--rule)}
.banner b{font-size:16px}
.banner p{margin:0;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);z-index:40;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-family:var(--f-data);font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: no-preference){.fill{transition:left .2s,width .2s}}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="top"></div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8.5 15l2.3 2.2L15.5 13"/></svg><span>Today</span></button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg><span>Week</span></button>
  <button data-tab="report"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z"/><path d="M14 3.5V8h4M10 12h5M10 15.5h5"/></svg><span>Report</span></button>
  <button data-tab="guide"><svg viewBox="0 0 24 24"><path d="M4 5.5c3-1.5 6-1.5 8 .5 2-2 5-2 8-.5v13c-3-1.5-6-1.5-8 .5-2-2-5-2-8-.5z"/><path d="M12 6v13.5"/></svg><span>Guide</span></button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-6"/></svg><span>Data</span></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,.txt,application/json,text/plain" hidden>

const store = {
  mode: "IndexedDB", db: null,
  async init() {
    if (!("indexedDB" in window)) { this.mode = "localStorage"; return; }
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);

    } catch (e) { this.mode = "localStorage"; }

  async get(k) {

    return new Promise((res, rej) => { const q = this.db.transaction("kv", "readonly").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  async set(k, v) {
    if (this.mode === "localStorage") { localStorage.setItem(DB_NAME + ":" + k, JSON.stringify(v)); return; }
    return new Promise((res, rej) => {
      const tx = this.db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k);

,"Sat 23 Jan","Controlled parkrun, HR 168-175","Sub-threshold Tuesdays, strides"],["2","Sat 20 Feb","parkrun, all-out only if the hip allows","5th run day, marathon-effort work"],["3","Sun 4 Apr","Half marathon","Your marathon tier"]]},{"p":"Gate 1 needs all five: decoupling under ~8% on the week-11 long run; no session pain above 3/10 and no gait change for three weeks; hip on waking not rising, ideally 0-2; HRV inside your band; base completion above ~80%."},{"p":"Gate 2 needs three weeks of sub-threshold and strides at 3/10 or less with no morning flare, and your physio happy with the weaker side. An all-out 5K should average close to LTHR 188; if it doesn't, the zones need re-anchoring."},{"p":"Gate 3: race the half only if Gate 2 was all-out and the hip has stayed quiet. Otherwise run it at marathon effort and take tier C."}]},{"title":"Marathon tiers","items":[{"table":[["Tier","Half marathon","Marathon target"],["A","1:52-1:55, run evenly","Sub-4 (5:41/km)"],["B","1:55-2:02","4:00-4:15"],["C","Not raced, hip complained, or slower","Run by HR (cap ~162) to 30 km"]]},{"p":"Riegel turns a 1:55 half into almost exactly 4:00, and it flatters runners with a thin endurance base, hence the faster end. Sub-4 is a stretch target; arriving at the start healthy is the plan."}]},{"title":"Heat and race morning","items":[{"table":[["Conditions","Adjust","Sub-4 becomes"],["Under 10°C, overcast","none","4:00"],["10-15°C","+5-10 s/km","~4:04-4:07"],["15-20°C","+12-20 s/km","~4:09-4:14"],["Over 20°C or full sun","+22-35 s/km","~4:16-4:25"]]},{"p":"Decide at breakfast, never at 30 km. EMF 2026 reached about 23°C and almost 60 runners were treated for heat exhaustion. Late May in Edinburgh is usually 8-15°C."},{"p":"Acclimation, weeks 26-30: a hot bath after an easy run, about 40°C, chest-deep, 30-40 min. Week 26: 4 sessions. Week 27: 4-5, not after the peak run. Weeks 28-29: one every ~3 days. Race week: the last one on Wednesday or Thursday."},{"p":"Cramp: the best predictors are a history of cramping and racing harder than you trained, not low salt. The marathon-effort blocks in weeks 24-27 are the real fix. If one hits: slow down, stretch and hold the muscle, walk 60-90 s."},{"src":"Ely et al., Med Sci Sports Exerc 2007;39:487-493. Daanen et al., Sports Med 2018;48:409-430. Schwellnus et al., Br J Sports Med 2011;45:650-656."}]},{"title":"Heart-rate zones (LTHR 188)","items":[{"table":[["Zone","bpm","Used for"],["Z1","133-150","Recovery runs, walks"],["Z2","150-167","Easy and long runs; marathon effort 160-167"],["Z3","167-197","Sub-threshold reps 168-178, from week 13"],["Z4","197-207","Gate 2 and races only"]]},{"p":"Pram runs read 5-10 bpm higher at the same effort. Go by HR, never pace, and push two-handed."}]},{"title":"Questions for your physio","items":[{"dl":[["1","How often: twice a week, as the plan assumes, or more?"],["2","When should the load go up on the 3 × 8?"],["3","What pain ceiling during and after runs? The plan uses 3/10."],["4","When are strides, hills and sub-threshold work OK? The plan unlocks them from late January."],["5","Does a long-run ladder from 30 min now to 160 min on 8 May fit their timeline?"],["6","When can full-body strength come back?"]]}]},{"title":"The race","items":[{"p":"Edinburgh Marathon, Sunday 30 May 2027, 10:00 start. Entries close 31 January 2027 at the latest and usually sell out before then."},{"p":"Not medical advice. Where your physio's instructions differ from this plan, theirs win."}]}];

  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { const u = $("usageVal"); if (u) u.textContent = Math.max(1, Math.round((e.usage || 0) / 1024)) + " KB"; }).catch(() => {});
  const pre = el("input", {class: "inp", type: "text", inputmode: "numeric", placeholder: "e.g. 28", value: S.settings.preLongest === null || S.settings.preLongest === undefined ? "" : String(S.settings.preLongest)});

function backupPayload() { return Object.assign(clone(S), {exportedAt: new Date().toISOString(), appVersion: APP_VERSION}); }
function markExported() { S.settings.lastExport = new Date().toISOString(); scheduleSave(); }
function exportData() {

  markExported(); toast("Backup saved to Downloads"); if (VIEW.tab !== "data") render();
}
async function shareBackup() {

const STR = (v, max) => typeof v === "string" ? v.slice(0, max) : undefined;
function cleanSection(src, spec) {
  if (!src || typeof src !== "object") return undefined;
  const out = {};
  for (const [k, kind] of Object.entries(spec)) {
    const v = src[k];
    if (kind === "n") { const n = num(v); if (n !== null) out[k] = n; }
    else if (kind === "s") { const s = STR(v, 2000); if (s) out[k] = s; }
    else if (Array.isArray(kind)) { if (kind.indexOf(v) >= 0) out[k] = v; }
  }
  return Object.keys(out).length ? out : undefined;
}
function sanitize(data) {
  if (!data || typeof data !== "object" || data.app !== APP_ID || !data.days || typeof data.days !== "object") throw new Error("This file isn't a backup from this app.");
  if ((data.schema || 0) > SCHEMA) throw new Error("This backup comes from a newer version of the app. Update the app first.");
  const sessSpec = {status: ["done", "short", "skipped"], type: TYPES.map(t => t[0]), min: "n", km: "n", avgHr: "n", maxHr: "n", cad: "n", rpe: "n", hip: "n", knee: "n", gait: ["yes", "no"], notes: "s"};
  const wellSpec = {sleepH: "n", sleepQ: "n", mood: "n", stress: "n", energy: "n", rhr: "n", hrv: "n", hipAM: "n", kneeAM: "n", alcohol: "n", line: "s"};
  const exSpec = {kg: "n", sets: "n", effR: "n", effL: "n", pain: "n"};
  const days = {};
  for (const [iso, d] of Object.entries(data.days)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso) || !d || typeof d !== "object") continue;
    const o = {};
    const s = cleanSection(d.session, sessSpec); if (s) o.session = s;
    const w = cleanSection(d.well, wellSpec); if (w) o.well = w;
    if (d.physio && typeof d.physio === "object") { const ph = {}; EX.forEach(([k]) => { const e = cleanSection(d.physio[k], exSpec); if (e) ph[k] = e; }); if (Object.keys(ph).length) o.physio = ph; }
    if (Object.keys(o).length) { o.updatedAt = STR(d.updatedAt, 40) || null; days[iso] = o; }
  }
  const st = data.settings || {};
  return {app: APP_ID, schema: SCHEMA, createdAt: STR(data.createdAt, 40) || new Date().toISOString(), updatedAt: STR(data.updatedAt, 40) || null,
    settings: {preLongest: num(st.preLongest), theme: ["dark", "light", "auto"].indexOf(st.theme) >= 0 ? st.theme : (S.settings.theme || "dark"),
      context: STR(st.context, 4000) || "", lastExport: STR(st.lastExport, 40) || S.settings.lastExport || null, welcomed: true}, days};
}
$("importFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const text = await f.text();
    let data; try { data = JSON.parse(text); } catch (err) { throw new Error("That file isn't readable JSON."); }
    const clean = sanitize(data);
    const keys = Object.keys(clean.days).sort();
    VIEW.pendingImport = {state: clean, name: f.name, count: keys.length, first: keys[0], last: keys[keys.length - 1], exportedAt: STR(data.exportedAt, 40)};
    VIEW.tab = "data"; render();
  } catch (err) { toast(err.message || "Import failed"); }
});
async function keepSnapshot(reason) {
  const snap = {savedAt: new Date().toISOString(), reason: reason, count: loggedDays().length, state: clone(S)};
  await store.set("snapshot", snap); snapshotInfo = {savedAt: snap.savedAt, reason: reason, count: snap.count};
}
async function applyImport() {
  const pi = VIEW.pendingImport; if (!pi) return;
  try { await flush(); await keepSnapshot("import"); S = pi.state; VIEW.pendingImport = null; dirty = true; await flush(); applyTheme(); render(); toast("Imported " + pi.count + " logged days"); }
  catch (e) { toast("Import failed: " + (e.message || "storage error")); }
}
async function undoSnapshot() {
  try { const snap = await store.get("snapshot"); if (!snap || !snap.state) { toast("Nothing to restore"); return; }
    S = snap.state; await store.del("snapshot"); snapshotInfo = null; dirty = true; await flush(); applyTheme(); render(); toast("Previous data restored"); }
  catch (e) { toast("Restore failed: " + (e.message || "storage error")); }
}
async function eraseAll() {
  try { const theme = S.settings.theme; S = blankState(); S.settings.theme = theme; S.settings.welcomed = true; await store.del("snapshot"); snapshotInfo = null; dirty = true; await flush(); render(); toast("Everything erased"); }
  catch (e) { toast("Erase failed: " + (e.message || "storage error")); }

/* ---------- theme, service worker, start ---------- */
function applyTheme() {

  try { localStorage.setItem("e27-theme", t); } catch (e) {}
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0D1514" : "#F1F5F3");
}
function updateBanner() {

    el("button", {class: "btn primary", onclick: async () => { await flush(); location.reload(); }}, "Reload"));

document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (["today", "week", "report", "guide", "data"].indexOf(t) >= 0 && t !== VIEW.tab) { VIEW.tab = t; render(); } });

  applyTheme();
  const h = location.hash.slice(1); if (["today", "week", "report", "guide", "data"].indexOf(h) >= 0) VIEW.tab = h;
  render();

    }).catch(() => {});

const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
